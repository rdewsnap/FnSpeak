<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Flowstate</title>
<style>
  body { font: 16px/1.5 -apple-system, system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; color: #222; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #111; } }
  button { font: inherit; padding: .5rem 1rem; }
  code { display: block; word-break: break-all; padding: .5rem; margin: .5rem 0; background: rgba(127,127,127,.15); }
</style>
</head>
<body>
<h1>Sign in to Flowstate</h1>
<p id="intro">Confirm to finish signing in.</p>
<button id="go">Sign in</button>
<div id="out"></div>
<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const out = document.getElementById("out");
  document.getElementById("go").onclick = async (e) => {
    e.target.disabled = true;
    const res = await fetch("/v1/auth/verify", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ token, name: "Browser sign-in" }),
    });
    const body = await res.json();
    out.textContent = "";
    if (!res.ok) {
      out.textContent = body.error ? body.error.message : "Sign-in failed.";
      return;
    }
    document.getElementById("intro").textContent = "Signed in as " + body.user.email + ".";
    const p = document.createElement("p");
    p.textContent = "Your API token (shown once). Paste it into Flowstate's settings or your MCP client:";
    const code = document.createElement("code");
    code.textContent = body.token;
    out.append(p, code);
    e.target.remove();
  };
</script>
</body>
</html>

[package]
name = "flowstate-server"
description = "Accounts, team sync, hosted cleanup and MCP for Flowstate"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Same version as flowstate-core: only one libsqlite3-sys may be linked.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Only the Postgres driver: sqlx's SQLite driver would pull a second libsqlite3-sys.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"], optional = true }
sqlx-postgres = { version = "=0.9.0", features = ["migrate"], optional = true }
sqlx-core = { version = "=0.9.0", features = ["migrate"], optional = true }
uuid = { version = "1.29.0", features = ["v7"] }
sha2 = "0.11.1"
hex = "0.4.3"
getrandom = "0.4.3"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.3"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[features]
default = []
postgres = ["dep:sqlx", "dep:sqlx-postgres", "dep:sqlx-core"]

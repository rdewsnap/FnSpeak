[package]
name = "flowstate-core"
description = "Local-first, context-aware dictation pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
rphonetic = "4.0.0"
strsim = "0.11.1"
whisper-rs = { version = "0.16.0", optional = true }
sherpa-rs = { version = "0.6.8", optional = true, default-features = false, features = ["download-binaries"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
sysinfo = "0.40.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = []
whisper = ["dep:whisper-rs"]
whisper-metal = ["whisper", "whisper-rs/metal"]
whisper-cuda = ["whisper", "whisper-rs/cuda"]
parakeet = ["dep:sherpa-rs"]
parakeet-cuda = ["parakeet", "sherpa-rs/cuda"]

[package]
name = "flowstate-ffi"
description = "UniFFI bindings for the Flowstate core (Swift today, C# later)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "flowstate_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
flowstate-core.workspace = true
thiserror.workspace = true
uniffi = { version = "0.32.2", features = ["cli"] }

[features]
default = []
whisper = ["flowstate-core/whisper"]
parakeet = ["flowstate-core/parakeet"]
# Everything the Mac app ships with.
mac = ["whisper", "parakeet", "flowstate-core/whisper-metal"]

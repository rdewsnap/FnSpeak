[project]
name = "fnspeak-training"
version = "0.1.0"
description = "Data generation and fine-tuning for FnSpeak's small cleanup model"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "datasets>=3.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Apple Silicon only.
train = ["mlx-lm>=0.26"]

[tool.uv]
package = false

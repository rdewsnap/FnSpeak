# Example Fly.io config: one machine with SQLite on a volume. From the
# repository root:
#   fly launch --no-deploy --copy-config --config deploy/fly.toml
#   fly volumes create flowstate_data --size 1 --config deploy/fly.toml
#   fly secrets set FLOWSTATE_SECRET=$(openssl rand -hex 32) --config deploy/fly.toml
#   fly deploy --config deploy/fly.toml --dockerfile deploy/Dockerfile .
# For more than one machine, use Postgres instead: set the
# FLOWSTATE_DATABASE_URL secret and drop the [mounts] section.

app = "flowstate-server"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  FLOWSTATE_BASE_URL = "https://flowstate-server.fly.dev"
  FLOWSTATE_DATABASE_URL = "sqlite:///data/flowstate.db"
  # Fly's proxy sets X-Forwarded-For, so rate limits see the real client.
  FLOWSTATE_TRUST_PROXY = "1"

[mounts]
  source = "flowstate_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
